  <text x="600" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="82" letter-spacing="1" fill="url(#nameGrad)" opacity="0.55" filter="url(#softBlur)">Neel Kore</text>
  <text x="600" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="82" letter-spacing="1" fill="url(#nameGrad)">Neel Kore</text>

  <text x="600" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="21" letter-spacing="0.4" fill="#9AA4BC">Computer Engineering Student  |  MERN Stack Developer  |  Cybersecurity Enthusiast</text>

