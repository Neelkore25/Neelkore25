    </filter>

    <filter id="wideBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <ellipse cx="600" cy="168" rx="300" ry="190" fill="url(#glow)" filter="url(#wideBlur)"/>

  <g fill="none" stroke="url(#ringGrad)" stroke-width="1">
    <ellipse cx="600" cy="168" rx="340" ry="118" transform="rotate(-4 600 168)"/>
    <ellipse cx="600" cy="168" rx="230" ry="168" transform="rotate(9 600 168)" stroke-opacity="0.7"/>
  </g>

  <g>
    <circle cx="238" cy="96" r="2.4" fill="#67E8F9" opacity="0.8"/>
    <circle cx="288" cy="150" r="1.6" fill="#93C5FD" opacity="0.6"/>
    <circle cx="204" cy="188" r="1.8" fill="#A78BFA" opacity="0.55"/>
    <circle cx="270" cy="238" r="2.1" fill="#60A5FA" opacity="0.7"/>
    <circle cx="360" cy="80" r="1.5" fill="#C4B5FD" opacity="0.5"/>
    <circle cx="962" cy="96" r="2.4" fill="#A78BFA" opacity="0.8"/>
    <circle cx="912" cy="150" r="1.6" fill="#67E8F9" opacity="0.6"/>
    <circle cx="996" cy="188" r="1.8" fill="#93C5FD" opacity="0.55"/>
    <circle cx="930" cy="238" r="2.1" fill="#60A5FA" opacity="0.7"/>
    <circle cx="840" cy="80" r="1.5" fill="#22D3EE" opacity="0.5"/>
    <circle cx="600" cy="26" r="1.8" fill="#93C5FD" opacity="0.5"/>
    <circle cx="600" cy="316" r="1.8" fill="#A78BFA" opacity="0.45"/>

