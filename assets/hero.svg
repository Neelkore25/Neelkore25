<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13"/>
      <stop offset="55%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#070A13"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#5B7CFA" stop-opacity="0.55"/>
      <stop offset="38%" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A13" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="25%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="45%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-100%" width="200%" height="300%">
